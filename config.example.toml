# =============================================================================
# arch-harness — пример конфигурации (config.toml)
# =============================================================================
# Порядок поиска конфига при запуске:
#   1. --config <path>
#   2. ./arch-harness.toml (текущий каталог)
#   3. ~/.config/arch-harness/config.toml
#   4. встроенные дефолты (этот файл их документирует полностью)
#
# Все секции опциональны (serde default) — указывайте только отличия.
# Тильда `~/` в путях раскрывается при загрузке (knowledge dirs, mcp/cron/paths).
# API-ключи НЕ пишутся в конфиг — только имена переменных окружения.
# =============================================================================

# Модель по умолчанию — ключ из секции [models.*].
default_model = "deepseek"

# -----------------------------------------------------------------------------
# LLM-провайдеры (OpenAI-совместимые endpoint'ы).
# api_key_env — имя переменной окружения с ключом (значение ключа не хранится!).
# temperature: не задана = провайдерский дефолт (поле просто опускается).
#
# thinking_on / thinking_off — карты ризонинга (JSON-объект, сливается в тело
# запроса при `/think on|off` в TUI или `arch run --think on|off`):
#   DeepSeek V4, GLM-4.x:  thinking = { type = "enabled" | "disabled" }
#   Kimi K3:               reasoning_effort = "max" | "low"  (выключить нельзя)
# Без `/think` карты не шлются — действует дефолт провайдера (у DeepSeek V4
# ризонинг по умолчанию ВКЛЮЧЁН с effort=high). Для thinking + tools DeepSeek
# требует эха reasoning_content — харнесс хранит его и возвращает сам.
#
# Актуальность id моделей сверена с официальной документацией (август 2026):
# deepseek-chat/reasoner сняты 2026-07-24 → v4-flash/v4-pro; kimi-k2 снят
# 2025-05-25 → kimi-k3; glm-4.6 → glm-4.7.
# -----------------------------------------------------------------------------
[models.deepseek]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-flash"           # быстрая модель для повседневных задач
api_key_env = "DEEPSEEK_API_KEY"
max_tokens = 8192
timeout_secs = 180
context_limit = 1000000
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

[models.deepseek-pro]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-pro"             # тяжёлый ризонинг: состязательное ревью, гейты
api_key_env = "DEEPSEEK_API_KEY"
max_tokens = 8192
timeout_secs = 300                    # pro думает дольше — бюджет тишины выше
context_limit = 1000000
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

[models.kimi]
# Официальная coding-поверхность Kimi Code (доки kimi.com/code): модели
# k3 / k3-256k; старая /v1 отдаёт 404, api.moonshot.ai душится DPI (флапает).
# Thinking-параметры поверхность не принимает (K3 ризонит всегда); temperature
# — только 1 (поэтому не шлём). Ключ: env KIMI_API_KEY или файл api_key_file.
base_url = "https://api.kimi.com/coding/v1"
model = "k3"                          # флагман Kimi Code, 256k контекст
api_key_env = "KIMI_API_KEY"
api_key_file = "~/.kimi_api_key"      # запасной путь, если env не задан
max_tokens = 8192
timeout_secs = 180
context_limit = 1000000

[models.glm]
# Международная площадка Z.AI (ключ ZHIPU_API_KEY с docs.z.ai — тот же
# аккаунт работает и на китайском open.bigmodel.cn). Для Китая —
# base_url = "https://open.bigmodel.cn/api/paas/v4".
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-5.2"                     # флагман Z.AI, 1M контекст (резервный провайдер)
api_key_env = "ZHIPU_API_KEY"
max_tokens = 8192
timeout_secs = 180
context_limit = 1000000
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

[models."glm-4.7"]
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-4.7"                     # прошлое поколение: дешевле флагмана вдвое
api_key_env = "ZHIPU_API_KEY"
max_tokens = 8192
timeout_secs = 180
context_limit = 204800
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

[models.glm-air]
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-4.5-air"                 # дешёвый рабочий (~$0.14/$0.86 за 1М)
api_key_env = "ZHIPU_API_KEY"
max_tokens = 8192
timeout_secs = 120
context_limit = 131072
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

[models.glm-flash]
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-4.7-flash"               # бесплатный тариф: черновики, крон, дайджесты
api_key_env = "ZHIPU_API_KEY"
max_tokens = 8192
timeout_secs = 120
context_limit = 204800
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

# -----------------------------------------------------------------------------
# Агентный цикл «модель ↔ инструменты».
# -----------------------------------------------------------------------------
[agent]
max_tool_turns = 4800                 # максимум итераций за один ход (по исчерпании — финальный ответ без инструментов; петли ловят детекторы)
context_budget_tokens = 6000000       # потолок бюджета контекста; авто-компактификация работает от
                                      # min(этого бюджета, context_limit модели): L1-маскирование на 70%,
                                      # L3-саммари на 95% окна модели; принудительно — /compact в TUI
stream = true                         # стримить дельты ответа в TUI/stdout

# -----------------------------------------------------------------------------
# LLM-судья рубрик (ADR-004): калибровка и верификация оценок.
# Каждый критерий оценивается samples независимыми прогонами судьи; итоговый
# балл — медиана, разброс σ выше unstable_stdev помечается `unstable`.
# Балл ≥ 2 обязан опираться на цитату из оцениваемого текста; цитата слабее
# evidence_min_similarity → `evidence_not_found`, критерий исключается из
# взвешенного итога. golden_max_mae — порог `arch bench run --golden`:
# итоговый MAE выше порога → exit code 1 (регрессионный гейт).
# -----------------------------------------------------------------------------
[judge]
samples = 3                           # сэмплов судьи на критерий (1 — одиночная оценка)
unstable_stdev = 1.0                  # порог population-σ сэмплов для метки unstable
evidence_min_similarity = 0.8         # fuzzy-порог подтверждения цитаты (0..=1; точное вхождение — всегда)
golden_max_mae = 1.0                  # максимальный MAE golden-прогона (в баллах шкалы)

# -----------------------------------------------------------------------------
# Локальная база знаний для `arch kb` и инструмента kb_search.
# Каталоги — доменные документы архитектора (разборы, концепты, скиллы);
# принцип Context Supply Chain: сужайте до релевантных доменов, не «вся Wiki».
# -----------------------------------------------------------------------------
[knowledge]
dirs = [
  "~/knowledge/architecture",      # разборы и статьи (ЗАМЕНИТЕ на свои каталоги)
  "~/knowledge/papers",            # научные статьи/концепты
  "~/knowledge/skills",            # ваша библиотека скиллов
]
extensions = ["md", "txt", "rst"]     # какие расширения индексировать

# -----------------------------------------------------------------------------
# Веб-доступ: поиск (DuckDuckGo HTML), фетч страниц, кураторские сайты.
# Кураторский список используется `arch web search --arch` и инструментом
# web_arch_sites: версии технологий проверяются по первоисточникам, не по памяти.
# -----------------------------------------------------------------------------
[web]
search_base = "https://html.duckduckgo.com/html/"
user_agent = "arch-harness/0.1 (+solution-architect harness)"
timeout_secs = 30
max_fetch_chars = 24000               # усечение текста страницы после html→text

[[web.arch_sites]]
name = "aws-arch"
base_url = "https://docs.aws.amazon.com/architecture/"
domain = "docs.aws.amazon.com"
description = "AWS Architecture Center: reference architectures, Well-Architected"

[[web.arch_sites]]
name = "azure-arch"
base_url = "https://learn.microsoft.com/azure/architecture/"
domain = "learn.microsoft.com"
description = "Azure Architecture Center: паттерны, reference architectures"

[[web.arch_sites]]
name = "gcp-arch"
base_url = "https://cloud.google.com/architecture"
domain = "cloud.google.com"
description = "Google Cloud Architecture Center"

[[web.arch_sites]]
name = "fowler"
base_url = "https://martinfowler.com/architecture/"
domain = "martinfowler.com"
description = "Мартин Фаулер: эссе по архитектуре, микросервисам, эволюционному дизайну"

[[web.arch_sites]]
name = "infoq-arch"
base_url = "https://www.infoq.com/architecture-design/"
domain = "infoq.com"
description = "InfoQ Architecture & Design: статьи и тренды"

[[web.arch_sites]]
name = "microservices-io"
base_url = "https://microservices.io/"
domain = "microservices.io"
