[[web.arch_sites]]
name = "sei"
base_url = "https://insights.sei.cmu.edu/library/"
domain = "insights.sei.cmu.edu"
description = "SEI/CAD: ATAM, архитектурные тактики, quality attributes"

[[web.arch_sites]]
