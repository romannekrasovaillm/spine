# -----------------------------------------------------------------------------
# Кодовые харнессы — адаптеры запуска внешних агентов реализации.
# prompt_mode: positional (промпт — аргумент) | flag ({prompt} в args) | stdin.
# handoff-пакет кладётся в <repo>/.arch-handoff/ командой `arch handoff`.
# Умные таймауты: timeout_secs — абсолютный потолок; idle_timeout_secs —
# таймаут тишины (нет вывода И нет изменений файлов репо — прогон завис и
# прерывается; молча работающий харнесс не трогаем, 0 — выключить). При любом
# прерывании убивается вся процессная группа (TERM→KILL): сирот не остаётся,
# частичный вывод возвращается в сводку.
# auto_commit: после успешного прогона незакоммиченные правки исполнителя
# фиксируются коммитом харнесса (кроме .arch-handoff/ и мусора __pycache__/
# *.pyc/.pytest_cache/) — контракт TASK.md требует финального коммита от
# исполнителя, а это страховка: результат всегда оказывается в git.
# -----------------------------------------------------------------------------
[harnesses.claude-code]
binary = "claude"
# --dangerously-skip-permissions обязателен для headless: иначе `claude -p`
# встаёт на permission-промпте файловых операций и висит до таймаута.
# Уберите флаг, если прогоны интерактивные.
args = ["-p", "--dangerously-skip-permissions"]
prompt_mode = "stdin"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true
# Whitelist наследуемого окружения (по умолчанию наследуется всё; непустой
# список — чистое окружение + перечисленное + env адаптера):
# env_allow = ["PATH", "HOME", "LANG", "TERM", "TMPDIR",
#              "HTTP_PROXY", "HTTPS_PROXY", "NO_PROXY",
#              "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL"]

[harnesses.qwen-code]
binary = "qwen"
args = []
prompt_mode = "stdin"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

[harnesses.openclaw]
binary = "openclaw"
# openclaw требует явный выбор сессии: --agent main; иначе код 1.
args = ["agent", "--agent", "main", "--message", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

[harnesses.hermes]
binary = "hermes"
# hermes: задача передаётся флагом -z PROMPT; stdin-режима нет (код 2 на -p).
args = ["-z", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

[harnesses.theseus]
binary = "theseus"
# theseus: -p PROMPT (flag-режим); "run --task" устарело — код 2.
args = ["-p", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

[harnesses.codewhale]
binary = "codewhale"
# codewhale: -p PROMPT (flag-режим); задача в stdin не принимается.
args = ["-p", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

[harnesses.kimi-code]
binary = "kimi"
# kimi: -p PROMPT (flag-режим). Permission-флаг НЕ нужен и недопустим:
# в `-p`-режиме regular-инструменты всегда под auto-политикой, а
# --yolo/--auto с --prompt несовместимы (запуск отклоняется). Модель
# исполнителя — добавьте в args: "-m", "<alias>".
args = ["-p", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

# -----------------------------------------------------------------------------
# MCP: файл серверов в формате Claude Code (см. examples/mcp.example.json).
# `arch init` кладёт образец в ~/.arch-harness/mcp.json.
# -----------------------------------------------------------------------------
[mcp]
servers_file = "~/.arch-harness/mcp.json"
connect_on_start = false              # false — ленивое подключение по первому вызову
timeout_secs = 60

# -----------------------------------------------------------------------------
# Политика автономии инструментов (R-уровни, AI-Disrupt PDLC): автономия
# калибруется риском действия, а не брендом модели. Проверка — в dispatch
# каждого инструмента; решения журналируются в сессии.
# -----------------------------------------------------------------------------
[policy]
autonomy = "R2"   # R0 только чтения | R2 +изменения (дефолт) | R4 деструктив с подтверждением | R5 полная (красный флаг аудита)

# -----------------------------------------------------------------------------
# Изоляция окружения bash-команд (defensive pattern DeepSeek Harness:
# недоверенному выводу — не ambient-окружение). Из окружения процесса,
# порождённого инструментом bash, выбрасываются переменные с
# секретоподобными именами (токены имени KEY/SECRET/TOKEN/PASSWORD/PASSWD/
# PASS/CREDENTIAL(S)/AUTH): DEEPSEEK_API_KEY, GH_TOKEN, SSH_AUTH_SOCK и т.п.
# не видны команде, которую написала модель. env_allow — точные имена-
# исключения, пропускаемые несмотря на scrub (понадобятся, если рабочему
# контуру нужен, например, GH_TOKEN для `gh`).
# -----------------------------------------------------------------------------
[bash]
env_scrub = true
env_allow = []      # пример: ["GH_TOKEN"]

# -----------------------------------------------------------------------------
# Плагины (открытый стандарт agent-plugins.org): пакеты «скиллы + MCP».
# Каждый прямой потомок каталога — плагин: plugin.json + skills/<name>/SKILL.md
# + mcp.json/.mcp.json (+ agents/, hooks/ как клиентские расширения).
# Первый каталог — локальная библиотека (arch init кладёт туда arch-core и
# плагины паттернов), второй — общая библиотека скиллов пользователя.
# -----------------------------------------------------------------------------
[plugins]
dirs = [
    "~/.arch-harness/plugins",
    # "~/knowledge/skills",   # раскомментируйте и укажите свою библиотеку плагинов
]
include_mcp = true   # MCP-серверы из плагинов (имена plugin.server) попадают в общий пул
include_hooks = true # хуки плагинов (hooks/hooks.json) исполняются в сессиях;
                     # false — только для недоверенных библиотек

# -----------------------------------------------------------------------------
# Планировщик md-задач (см. cron.example.toml).
# out_dir не задан — отчёты пишутся в <reports_dir>/cron.
# -----------------------------------------------------------------------------
[cron]
file = "~/.arch-harness/cron.toml"
# out_dir = "~/.arch-harness/reports/cron"

# -----------------------------------------------------------------------------
# Пути к ассетам и данным. assets_dir: prompts/, rubrics/, benchmarks/, ascii/
# (раскладываются `arch init` из встроенных). sessions — append-only журналы.
# -----------------------------------------------------------------------------
[paths]
assets_dir = "~/.arch-harness/assets"
reports_dir = "~/.arch-harness/reports"
sessions_dir = "~/.arch-harness/sessions"
